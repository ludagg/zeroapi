name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Annule les runs précédents encore en cours sur la même réf (économie de minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `postinstall` lance `prisma generate` → le client Prisma (enums typés
      # JobStatus, Plan, etc.) est disponible pour le typecheck.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Suite hors-ligne : aucune DB, aucun secret, aucun réseau requis
      # (mocks LLM, round-trips de chiffrement, fonctions pures de spec).
      - name: Tests
        run: pnpm test:all
